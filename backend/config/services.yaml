parameters:
    env(UPDATE_REPOSITORY): 'fayouz/rocket-place'
    env(ROCKET_CLOUD_URL): ''
    env(ROCKET_MAILER_URL): ''
    env(ROCKET_MAILER_MAILBOX): ''
    env(ROCKET_MAILER_SENDER): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Tokens read at call time from the secrets vault (App\Secrets\IntegrationSecrets).
            $nukiApiToken: '@App\Secrets\IntegrationSecrets'
            $cloudUrl: '%env(ROCKET_CLOUD_URL)%'
            $cloudToken: '@App\Secrets\IntegrationSecrets'
            $mailerUrl: '%env(ROCKET_MAILER_URL)%'
            $mailerMailbox: '%env(ROCKET_MAILER_MAILBOX)%'
            $demoMailerPath: '%kernel.project_dir%/var/demo-mailer-%kernel.environment%.json'
            $storagePath: '%kernel.project_dir%/var/demo-cloud.json'

    App\:
        resource: '../src/'

when@test:
    services:
        App\Tests\Support\HttpMock: ~
